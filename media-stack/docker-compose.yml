  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
  volumes:
    - ./radarr:/config
    - ${MEDIA_PATH}:/media
    - ${DOWNLOADS_PATH}:/downloads
  networks:
    - caddy
  labels:
    caddy: radarr.${FQDN}
    caddy.reverse_proxy: "{{upstreams 7878}}"
  restart: unless-stopped

sonarr:
  image: lscr.io/linuxserver/sonarr:latest
  container_name: sonarr
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
  volumes:
    - ./sonarr:/config
    - ${MEDIA_PATH}:/media
    - ${DOWNLOADS_PATH}:/downloads
  networks:
    - caddy
  labels:
    caddy: sonarr.${FQDN}
    caddy.reverse_proxy: "{{upstreams 8989}}"
  restart: unless-stopped

bazarr:
  image: linuxserver/bazarr:latest
  container_name: bazarr
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
  volumes:
    - ./bazarr:/config
    - ${MEDIA_PATH}:/media
  networks:
    - caddy
  labels:
